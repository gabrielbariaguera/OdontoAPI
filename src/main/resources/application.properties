spring.application.name=OdontoAPI
server.port=8080

# ==========================================
# Configuracao do Banco de Dados PostgreSQL
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/odonto_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Configuracoes do JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Configuracoes do Swagger / OpenAPI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
